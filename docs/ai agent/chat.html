<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Compass // AI Chat</title>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;500;700;800&display=swap');

    :root {
      /* 라이트 모드 변수 */
      --bg-gradient: linear-gradient(135deg, #eef5fc 0%, #d6e8f7 100%);
      --header-bg: rgba(255, 255, 255, 0.85);
      --card-bg: rgba(255, 255, 255, 0.9);
      --text-main: #111111;
      --text-sub: #555555;
      --btn-bg: #111111;
      --btn-text: #ffffff;
      --btn-hover: #2a2a2a;
      --accent-color: #2a7a32;
      --chat-user-bg: #111111;
      --chat-user-text: #ffffff;
      --chat-ai-bg: #ffffff;
      --chat-ai-text: #111111;
      --border: rgba(0, 0, 0, 0.08);
    }

    [data-theme="dark"] {
      /* 다크 모드 변수 */
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      --header-bg: rgba(30, 41, 59, 0.85);
      --card-bg: rgba(30, 41, 59, 0.9);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --btn-bg: #334155;
      --btn-text: #ffffff;
      --btn-hover: #475569;
      --accent-color: #4ade80;
      --chat-user-bg: #475569;
      --chat-user-text: #ffffff;
      --chat-ai-bg: #1e293b;
      --chat-ai-text: #f8fafc;
      --border: rgba(255, 255, 255, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      transition: background-color 0.3s, color 0.3s, border-color 0.3s;
    }

    body {
      width: 100vw;
      height: 100vh;
      background: var(--bg-gradient);
      font-family: 'Pretendard', sans-serif;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 90px;
      padding-bottom: 20px;
      overflow: hidden;
    }

    /* 슬라이드 업 애니메이션 */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 상단 헤더 컨테이너 */
    .header-wrapper {
      position: fixed;
      top: 20px;
      width: 100%;
      display: flex;
      justify-content: center;
      padding: 0 20px;
      z-index: 100;
    }

    .top-header {
      width: 100%;
      max-width: 900px;
      background: var(--header-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      padding: 10px 24px;
      border-radius: 50px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .logo {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .logo .tag { font-size: 0.75rem; color: var(--accent-color); font-weight: 700; }

    .nav-buttons { display: flex; align-items: center; gap: 10px; }

    .btn-top {
      padding: 8px 16px;
      background-color: var(--btn-bg);
      color: var(--btn-text);
      font-size: 0.85rem;
      font-weight: 600;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn-top:hover { background-color: var(--btn-hover); transform: translateY(-2px); }

    .theme-toggle-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      color: var(--text-main);
      padding: 6px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 채팅 메인 컨테이너 */
    .chat-container {
      width: 100%;
      max-width: 900px;
      height: calc(100vh - 120px);
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0,0,0,0.08);
      animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      overflow: hidden;
    }

    /* 채팅 헤더 (대화 초기화 버튼 포함) */
    .chat-header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-title { font-weight: 700; font-size: 1.05rem; }

    .btn-clear {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-sub);
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-clear:hover { color: #e11d48; border-color: #e11d48; }

    /* 메시지 내역 출력 창 */
    .chat-messages {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      max-width: 70%;
      padding: 14px 18px;
      border-radius: 18px;
      font-size: 0.95rem;
      line-height: 1.5;
      word-break: break-word;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    .message.user {
      align-self: flex-end;
      background-color: var(--chat-user-bg);
      color: var(--chat-user-text);
      border-bottom-right-radius: 4px;
    }

    .message.ai {
      align-self: flex-start;
      background-color: var(--chat-ai-bg);
      color: var(--chat-ai-text);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    /* 입력 폼 하단 고정 */
    .chat-input-area {
      padding: 16px 24px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 12px;
    }

    .chat-input {
      flex: 1;
      padding: 14px 20px;
      border-radius: 30px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.05);
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
    }

    .chat-input:focus { border-color: var(--accent-color); }

    .btn-send {
      padding: 0 24px;
      background-color: var(--btn-bg);
      color: var(--btn-text);
      border: none;
      border-radius: 30px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-send:hover { background-color: var(--btn-hover); }
  </style>
</head>
<body>

  <div class="header-wrapper">
    <header class="top-header">
      <div class="logo" onclick="window.location.href='main.html'">
        <span class="tag">AI COMPASS</span>
        Game Compass
      </div>

      <div class="nav-buttons">
        <button class="btn-top" onclick="window.location.href='main.html'">
          <span>프로젝트 소개</span>
        </button>

        <button class="btn-top" onclick="window.location.href='attender_introduce.html'">
          <span>참여자 소개</span>
        </button>

        <button class="btn-top" onclick="window.location.reload()">
          <span>채팅하기 🔄</span>
        </button>

        <button class="theme-toggle-btn" id="themeToggle" aria-label="테마 변경">
          <svg id="moonIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
          <svg id="sunIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </button>
      </div>
    </header>
  </div>

  <main class="chat-container">
    <div class="chat-header">
      <span class="chat-title">🤖 AI Game Assistant</span>
      <button class="btn-clear" onclick="clearChat()">대화 내역 삭제</button>
    </div>

    <div class="chat-messages" id="chatMessages">
      </div>

    <form class="chat-input-area" id="chatForm">
      <input type="text" class="chat-input" id="userInput" placeholder="게임에 대해 궁금한 점을 물어보세요..." autocomplete="off">
      <button type="submit" class="btn-send">전송</button>
    </form>
  </main>

  <script>
    // --- 1. 테마 관련 스크립트 ---
    const themeToggleBtn = document.getElementById('themeToggle');
    const moonIcon = document.getElementById('moonIcon');
    const sunIcon = document.getElementById('sunIcon');

    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
      moonIcon.style.display = 'none';
      sunIcon.style.display = 'block';
    }

    themeToggleBtn.addEventListener('click', () => {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      if (currentTheme === 'dark') {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('theme', 'light');
        moonIcon.style.display = 'block';
        sunIcon.style.display = 'none';
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('theme', 'dark');
        moonIcon.style.display = 'none';
        sunIcon.style.display = 'block';
      }
    });

    // --- 2. 채팅 내역 저장/복원 스크립트 (localStorage) ---
    const chatMessages = document.getElementById('chatMessages');
    const chatForm = document.getElementById('chatForm');
    const userInput = document.getElementById('userInput');

    // 기본 안내 메시지
    const defaultMessages = [
      { sender: 'ai', text: '안녕하세요! Game Compass AI입니다. 어떤 게임 가이드가 필요하신가요?' }
    ];

    // 저장된 채팅 내역 불러오기
    function loadChatHistory() {
      const history = JSON.parse(localStorage.getItem('chatHistory')) || defaultMessages;
      chatMessages.innerHTML = '';
      history.forEach(msg => appendMessageUI(msg.sender, msg.text));
      scrollToBottom();
    }

    // 메시지 화면 표시
    function appendMessageUI(sender, text) {
      const msgDiv = document.createElement('div');
      msgDiv.classList.add('message', sender);
      msgDiv.innerText = text;
      chatMessages.appendChild(msgDiv);
    }

    // localStorage에 저장
    function saveMessage(sender, text) {
      const history = JSON.parse(localStorage.getItem('chatHistory')) || defaultMessages;
      history.push({ sender, text });
      localStorage.setItem('chatHistory', JSON.stringify(history));
    }

    // 스크롤 최하단 이동
    function scrollToBottom() {
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    // 메시지 전송 이벤트 처리
    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = userInput.value.trim();
      if (!text) return;

      // 사용자 메시지 추가 및 저장
      appendMessageUI('user', text);
      saveMessage('user', text);
      userInput.value = '';
      scrollToBottom();

      // AI 가상 응답 (추후 백엔드 API 연동 가능)
      setTimeout(() => {
        const aiReply = `"${text}"에 대해 분석 중입니다. 잠시만 기다려주세요!`;
        appendMessageUI('ai', aiReply);
        saveMessage('ai', aiReply);
        scrollToBottom();
      }, 600);
    });

    // 대화 내역 전체 삭제
    function clearChat() {
      if (confirm('대화 내역을 초기화하시겠습니까?')) {
        localStorage.removeItem('chatHistory');
        loadChatHistory();
      }
    }

    // 페이지 로드 시 채팅 내역 복원
    loadChatHistory();
  </script>
</body>
</html>
