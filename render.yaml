version: "1"

services:
  - type: web
    name: game-mod-compass-api
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ALLOWED_ORIGINS
        fromService:
          type: web
          name: game-mod-compass-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: DATA_DIR
        value: /var/data
      - key: CURSEFORGE_API_KEY
        sync: false
    disk:
      name: app-data
      mountPath: /var/data
      sizeGB: 1

  - type: web
    name: game-mod-compass-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE
        fromService:
          type: web
          name: game-mod-compass-api
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
